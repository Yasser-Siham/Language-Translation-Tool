<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center font-sans">
    
    <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-2xl border-t-4 border-blue-600">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">Moteur de Traduction</h1>
        
        <!-- Sélection des langues source et cible -->
        <div class="grid grid-cols-2 gap-6 mb-6">
            <div>
                <label class="block text-gray-700 font-semibold mb-2">Langue Source</label>
                <select id="sourceLang" class="w-full border-gray-300 border p-3 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    <option value="ar">Arabe (العربية)</option>
                    <option value="en">Anglais (English)</option>
                    <option value="fr">Français</option>
                    <option value="es">Espagnol (Español)</option>
                </select>
            </div>
            <div>
                <label class="block text-gray-700 font-semibold mb-2">Langue Cible</label>
                <select id="targetLang" class="w-full border-gray-300 border p-3 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    <option value="en">Anglais (English)</option>
                    <option value="ar">Arabe (العربية)</option>
                    <option value="fr">Français</option>
                    <option value="es">Espagnol (Español)</option>
                </select>
            </div>
        </div>

        <!-- Zone de texte pour saisir l'entrée à traduire -->
        <textarea id="inputText" rows="5" class="w-full border-gray-300 border p-4 rounded-lg mb-6 focus:ring-2 focus:ring-blue-500 outline-none resize-none text-lg" placeholder="Entrez le texte à traduire ici..."></textarea>
        
        <!-- Bouton de traduction -->
        <button id="translateBtn" class="w-full bg-blue-600 text-white font-bold text-lg py-3 rounded-lg hover:bg-blue-700 transition duration-300 shadow-md">Traduire</button>

        <!-- Zone d'affichage du résultat traduit -->
        <div class="mt-8">
            <label class="block text-gray-700 font-semibold mb-2">Résultat :</label>
            <div id="outputText" class="w-full min-h-[120px] border border-gray-200 p-4 rounded-lg bg-gray-50 text-gray-800 text-lg"></div>
        </div>
    </div>

    <script>
        // Ajout d'un événement sur le bouton de traduction
        document.getElementById('translateBtn').addEventListener('click', async () => {
            // 1. Récupération des valeurs depuis l'interface utilisateur
            const text = document.getElementById('inputText').value;
            const source = document.getElementById('sourceLang').value;
            const target = document.getElementById('targetLang').value;
            const outputDiv = document.getElementById('outputText');

            // Vérification si le texte est vide
            if (!text) {
                alert("Veuillez entrer un texte à traduire.");
                return;
            }

            outputDiv.innerHTML = "<span class='text-blue-500'>Traduction en cours...</span>";

            try {
                // 2. Envoi de la requête POST au serveur backend (Flask)
                const response = await fetch('http://127.0.0.1:5000/translate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ text: text, source: source, target: target })
                });

                // 3. Réception et affichage clair du résultat sur l'écran
                const data = await response.json();
                
                if (data.translated_text) {
                    outputDiv.innerHTML = data.translated_text;
                } else {
                    outputDiv.innerHTML = "<span class='text-red-500'>Erreur lors de la traduction.</span>";
                }
            } catch (error) {
                outputDiv.innerHTML = "<span class='text-red-500'>Erreur de connexion au serveur backend. Assurez-vous que app.py est en cours d'exécution.</span>";
                console.error(error);
            }
        });
    </script>
</body>
</html>
